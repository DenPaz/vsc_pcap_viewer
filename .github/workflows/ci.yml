name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (lint, backend, unit, webview e2e, VS Code smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install tshark
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark xvfb
      # Python 3.14 on PATH for the extension (it looks for python3.14/python3);
      # uv uses the same version from .python-version for the dev venv.
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: |
          pnpm run lint
          pnpm run format:check
          uv run ruff check
          uv run ruff format --check
          uv run mypy
      - name: Backend tests
        run: uv run pytest
      - name: Install Chromium for webview e2e
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Unit + webview tests
        run: pnpm run test:unit
      - name: VS Code smoke test
        run: xvfb-run -a pnpm run test:extension
      - name: Package
        run: pnpm run package

  cross-platform:
    name: ${{ matrix.os }} (backend, unit, webview e2e, VS Code smoke)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # tshark, capinfos, editcap and mergecap, so the tshark tests run here too.
      - name: Install Wireshark (macOS)
        if: runner.os == 'macOS'
        run: brew install --formula wireshark
      - name: Install Wireshark (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wireshark -y --no-progress
          "C:\Program Files\Wireshark" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: tshark version
        run: tshark --version
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - name: Backend tests
        run: uv run pytest
      - name: Install Chromium for webview e2e
        run: pnpm exec playwright-core install chromium
      - name: Unit + webview tests
        run: pnpm run test:unit
      - name: VS Code smoke test
        run: pnpm run test:extension
