[project]
name = "pcap-viewer-backend"
version = "0.1.0"
description = "tshark-orchestrating JSON-RPC backend for the PCAP Viewer VS Code extension"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
# The backend is stdlib-only at runtime so the extension works with any
# Python 3.14+ interpreter, without a virtualenv or `pip install`.
dependencies = []

[project.scripts]
pcap-viewer-backend = "pcap_backend.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "scapy>=2.5",
    "pytest-bdd>=8.1.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/pcap_backend"]

[tool.pytest.ini_options]
testpaths = ["test/backend"]
pythonpath = ["backend"]
addopts = ["-ra", "--strict-markers"]
filterwarnings = [
    "error::ResourceWarning",  # leaked pipes/files from tshark runs are bugs
    "ignore:'maxsplit' is passed as positional argument:DeprecationWarning:gherkin",
]
markers = [
    "tshark: requires tshark/capinfos to be installed",
    "lua: runs a Lua dissector (skipped as root: tshark disables Lua for root)",
]
bdd_features_base_dir = "test/backend/acceptance/features"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["backend", "test/backend"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # shadowed builtins
    "C4",       # comprehensions
    "SIM",      # simplify
    "RET",      # return statements
    "PIE",      # misc. lints
    "PERF",     # performance anti-patterns
    "FURB",     # refurb
    "FLY",      # static joins → f-strings
    "RSE",      # raise statements
    "TRY",      # exception handling
    "BLE",      # blind except
    "ARG",      # unused arguments
    "DTZ",      # naive datetimes
    "T10",      # debugger calls
    "T20",      # print: stdout is the backend's protocol channel
    "S",        # bandit (security)
    "PTH",      # pathlib
    "PL",       # pylint
    "PT",       # pytest style
    "G", "LOG", # logging
    "ISC",      # implicit string concatenation
    "ICN", "TID", "PGH", "EXE", "YTT", "ASYNC",
    "RUF",      # ruff-specific
]
ignore = [
    "S603",    # subprocess without shell: we always pass argv lists, never shell=True
    "PLR0913", # too many arguments
    "PLR2004", # magic values
    "PLR0911", # too many returns
    "PLR0912", # too many branches
    "PLR0917", # too many positional arguments
    "S101",    # asserts are used for type narrowing
    "TRY003",  # messages are given where the exception is raised (errors reach the user)
    "PT018",   # composite assertions are deliberate in the tests
    "ISC001",  # conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"test/**" = ["S101", "PLR2004", "S108"]
"test/fixtures/generate.py" = ["S311", "T201"]  # a command-line tool: it reports on stdout
"test/perf/bench.py" = ["T201"]  # a command-line tool: it reports on stdout
"test/backend/test_stats.py" = ["E501"]  # captured tshark report text
"test/backend/test_export.py" = ["E501"]  # one-line request literals
"test/backend/test_navigation.py" = ["E501"]
"test/backend/test_quick_detail.py" = ["E501"]  # a hand-laid-out PDML tree

[tool.ruff.lint.isort]
known-first-party = ["pcap_backend"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.mypy]
python_version = "3.14"
strict = true
files = ["backend/pcap_backend"]
